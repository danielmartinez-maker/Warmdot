name: Windows workspace check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Type-check workspace
        run: cargo check --workspace
      - name: Run workspace tests
        run: cargo test --workspace

  package:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release player
        run: cargo build --release -p forge-player
      - name: Validate Action Arena project
        run: cargo run --release -p forge-player -- --validate examples/action_arena/project.forgeproj
      - name: Export standalone Action Arena package
        run: cargo run --release -p forge-player -- --export examples/action_arena/project.forgeproj artifacts/action-arena-windows
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli
      - name: Generate third-party license notices
        run: cargo about generate --manifest-path examples/forge_player/Cargo.toml --target x86_64-pc-windows-msvc --locked --fail --output-file artifacts/action-arena-windows/THIRD_PARTY_LICENSES.html about.hbs
      - name: Check exported package contents
        shell: pwsh
        run: |
          $required = @(
            'artifacts/action-arena-windows/Forge2DPlayer.exe',
            'artifacts/action-arena-windows/run-game.bat',
            'artifacts/action-arena-windows/LICENSE',
            'artifacts/action-arena-windows/THIRD_PARTY_LICENSES.html',
            'artifacts/action-arena-windows/Game/project.forgeproj',
            'artifacts/action-arena-windows/Game/Scenes/Main.forgescene',
            'artifacts/action-arena-windows/Game/Scenes/Menu.forgescene',
            'artifacts/action-arena-windows/Game/Assets/MainHUD.forgeui.json',
            'artifacts/action-arena-windows/Game/Assets/ArenaTiles.png',
            'artifacts/action-arena-windows/Game/Assets/CharacterSprites.forgeatlas.json',
            'artifacts/action-arena-windows/Game/Assets/CharacterSprites.png',
            'artifacts/action-arena-windows/Game/Assets/EnemyWalk.forgeanim.json',
            'artifacts/action-arena-windows/Game/Assets/PlayerWalk.forgeanim.json',
            'artifacts/action-arena-windows/Game/Assets/Default.forgetilemap.json',
            'artifacts/action-arena-windows/Game/Assets/Menu.forgeui.json',
            'artifacts/action-arena-windows/Game/Assets/PlayerController.luau',
            'artifacts/action-arena-windows/Game/Assets/UIController.luau',
            'artifacts/action-arena-windows/Game/Assets/Audio/arena-music.wav',
            'artifacts/action-arena-windows/Game/Assets/Audio/click.wav',
            'artifacts/action-arena-windows/Game/.forge/asset-index.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing expected export file: $path"
            }
          }
          $licenseHtml = Get-Content -LiteralPath 'artifacts/action-arena-windows/THIRD_PARTY_LICENSES.html' -Raw
          if ($licenseHtml.Length -lt 100 -or $licenseHtml -notmatch 'Third Party Licenses') {
            throw 'Third-party license report is empty or missing its title.'
          }
      - name: Upload Windows player package
        uses: actions/upload-artifact@v4
        with:
          name: forge2d-action-arena-windows
          path: artifacts/action-arena-windows
          if-no-files-found: error
